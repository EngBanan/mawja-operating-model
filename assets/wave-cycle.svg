<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .bg     { fill: #ffffff; }
    .band   { fill: #f6f8fa; }
    .card   { fill: #ffffff; stroke: #d0d7de; }
    .accent { fill: #ecfdf5; stroke: #0e715f; }
    .gate   { fill: #fff5f5; stroke: #cf222e; }
    .num    { fill: #8c959f; font-size: 12px; font-weight: 700; letter-spacing: .1em; }
    .ttl    { fill: #1f2328; font-size: 14px; font-weight: 650; }
    .sub    { fill: #656d76; font-size: 12.5px; }
    .hdr    { fill: #656d76; font-size: 11px; font-weight: 700; letter-spacing: .14em; }
    .foot   { fill: #6e7781; font-size: 12px; }
    .arrow  { stroke: #8c959f; }
    .ahead  { fill: #8c959f; }
    .rule   { stroke: #d0d7de; }
    .at     { fill: #0e715f; }
    .gt     { fill: #cf222e; }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .band{fill:#161b22} .card{fill:#161b22;stroke:#30363d}
      .accent{fill:#0c2b24;stroke:#2ea88a} .gate{fill:#2a1416;stroke:#f85149}
      .num{fill:#6e7681} .ttl{fill:#e6edf3} .sub{fill:#8b949e} .hdr{fill:#8b949e}
      .foot{fill:#8b949e} .arrow{stroke:#6e7681} .ahead{fill:#6e7681} .rule{stroke:#30363d}
      .at{fill:#2ea88a} .gt{fill:#f85149}
    }
  </style>
  <rect class="bg" width="1240" height="470"/>

  <text class="hdr" x="36"  y="38">PREPARE</text>
  <text class="hdr" x="318" y="38">BUILD</text>
  <text class="hdr" x="538" y="38">VERIFY</text>
  <text class="hdr" x="1004" y="38">MERGE</text>
  <line class="rule" x1="36" y1="52" x2="1204" y2="52" stroke-width="1"/>

  <!-- verification band: starts with its first card, ends with its last -->
  <rect class="band" x="528" y="66" width="428" height="330" rx="12"/>

  <!-- 01 -->
  <rect class="card" x="36" y="78" width="232" height="88" rx="10" stroke-width="1.5"/>
  <text class="num" x="54" y="102">01</text>
  <text class="ttl" x="54" y="124">Measure the current state</text>
  <text class="sub" x="54" y="146">Run current checks</text>
  <text class="sub" x="54" y="162">and record their output.</text>

  <line class="arrow" x1="152" y1="166" x2="152" y2="186" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 02 -->
  <rect class="card" x="36" y="192" width="232" height="70" rx="10" stroke-width="1.5"/>
  <text class="num" x="54" y="216">02</text>
  <text class="ttl" x="54" y="238">Plan the batches</text>
  <text class="sub" x="54" y="256">One batch, one commit.</text>

  <line class="arrow" x1="268" y1="227" x2="304" y2="227" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 03 -->
  <rect class="card" x="314" y="192" width="188" height="88" rx="10" stroke-width="1.5"/>
  <text class="num" x="332" y="216">03</text>
  <text class="ttl" x="332" y="238">Implement</text>
  <text class="sub" x="332" y="256">Implement in</text>
  <text class="sub" x="332" y="274">a separate conversation.</text>

  <line class="arrow" x1="502" y1="140" x2="544" y2="140" stroke-width="1.5" marker-end="url(#a)"/>
  <path class="arrow" d="M 408 192 L 408 160 L 502 160 L 502 140" fill="none" stroke-width="1.5"/>

  <!-- 04: accented -->
  <rect class="accent" x="550" y="82" width="384" height="94" rx="10" stroke-width="2"/>
  <text class="num" x="570" y="106">04</text>
  <text class="ttl at" x="570" y="128">Independent verification</text>
  <text class="sub" x="570" y="150">Review the implementation branch.</text>
  <text class="sub" x="570" y="168">Executor checks, then independent review.</text>

  <line class="arrow" x1="742" y1="176" x2="742" y2="196" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 05 -->
  <rect class="card" x="550" y="202" width="384" height="70" rx="10" stroke-width="1.5"/>
  <text class="num" x="570" y="226">05</text>
  <text class="ttl" x="570" y="248">Adversarial review</text>
  <text class="sub" x="570" y="266">Test likely failure cases.</text>

  <line class="arrow" x1="742" y1="272" x2="742" y2="292" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 06 -->
  <rect class="card" x="550" y="298" width="384" height="84" rx="10" stroke-width="1.5"/>
  <text class="num" x="570" y="322">06</text>
  <text class="ttl" x="570" y="344">Resolve findings</text>
  <text class="sub" x="570" y="364">Fix findings or record</text>
  <text class="sub" x="570" y="378">numbered debt with closure criteria.</text>

  <!-- findings return to implement -->
  <path class="arrow" d="M 550 340 L 520 340 L 520 290 L 408 290 L 408 282" fill="none" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text class="foot" x="416" y="306">findings</text>

  <!-- the sensitivity gate -->
  <line class="arrow" x1="934" y1="340" x2="982" y2="340" stroke-width="1.5" marker-end="url(#a)"/>
  <rect class="gate" x="992" y="290" width="212" height="100" rx="10" stroke-width="2"/>
  <text class="ttl gt" x="1006" y="318">High sensitivity?</text>
  <text class="sub" x="1006" y="340">Stop before merge.</text>
  <text class="sub" x="1006" y="358">Owner approval is required</text>
  <text class="sub" x="1006" y="376">before merging.</text>

  <!-- 07 -->
  <rect class="card" x="992" y="78" width="212" height="120" rx="10" stroke-width="1.5"/>
  <text class="num" x="1006" y="102">07</text>
  <text class="ttl" x="1006" y="124">Merge and document</text>
  <text class="sub" x="1006" y="148">Wave log · recorded decision</text>
  <text class="sub" x="1006" y="166">· findings · closure evidence</text>
  <text class="sub" x="1006" y="186">Owner decides when to ship</text>

  <path class="arrow" d="M 1093 290 L 1093 208" fill="none" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="foot" x="1101" y="252" style="font-size:12px">high → Owner review</text>
  <path class="arrow" d="M 934 322 L 962 322 L 962 262 M 962 228 L 962 152 L 986 152" fill="none" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="foot" x="962" y="238" style="font-size:11.5px" text-anchor="middle">medium</text><text class="foot" x="962" y="253" style="font-size:11.5px" text-anchor="middle">or low</text>

  <line class="rule" x1="36" y1="420" x2="1204" y2="420" stroke-width="1"/>
  <text class="foot" x="36" y="444">One wave · bounded scope · one branch · one exit gate</text>
  <text class="foot" x="1204" y="444" text-anchor="end">Medium: recommend release · Low: Conductor review</text>

  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ahead" d="M 0 0 L 8 4 L 0 8 z" fill="#8c959f"/>
    </marker>
  </defs>
</svg>
