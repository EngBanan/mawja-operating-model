<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="roadmap-title roadmap-description">
  <title id="roadmap-title">Mawja reading roadmap</title>
  <desc id="roadmap-description">Start with your goal. Understand Mawja by reading the workflow and worked example. Try a runnable example by choosing a language and following its tutorial. Adopt Mawja by assessing your project, configuring the tools and validating the integration.</desc>
  <style>
    .bg     { fill: #ffffff; }
    .card   { fill: #ffffff; stroke: #d0d7de; }
    .accent { fill: #ecfdf5; stroke: #0e715f; }
    .role   { fill: #1f2328; font-size: 19px; font-weight: 700; }
    .ttl    { fill: #1f2328; font-size: 14px; font-weight: 650; }
    .sub    { fill: #656d76; font-size: 12.5px; }
    .hdr    { fill: #656d76; font-size: 11px; font-weight: 700; letter-spacing: .14em; }
    .foot   { fill: #6e7781; font-size: 12.5px; }
    .arrow  { stroke: #8c959f; }
    .ahead  { fill: #8c959f; }
    .rule   { stroke: #d0d7de; }
    .at     { fill: #0e715f; }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .card{fill:#161b22;stroke:#30363d}
      .accent{fill:#0c2b24;stroke:#2ea88a}
      .role{fill:#e6edf3} .ttl{fill:#e6edf3} .sub{fill:#8b949e} .hdr{fill:#8b949e}
      .foot{fill:#8b949e} .arrow{stroke:#6e7681} .ahead{fill:#6e7681} .rule{stroke:#30363d}
      .at{fill:#2ea88a}
    }
  </style>
  <rect class="bg" width="1240" height="470"/>

  <text class="hdr" x="36" y="38">CHOOSE YOUR STARTING POINT</text>
  <line class="rule" x1="36" y1="52" x2="1204" y2="52" stroke-width="1"/>

  <g data-card="start">
    <rect class="accent" x="436" y="76" width="368" height="64" rx="10" stroke-width="2"/>
    <text class="role at" x="620" y="105" text-anchor="middle">Start here</text>
    <text class="sub" x="620" y="126" text-anchor="middle">Choose the goal that fits your project.</text>
  </g>

  <path class="arrow" d="M 620 140 L 620 162 M 220 162 L 1020 162" fill="none" stroke-width="1.5"/>
  <line class="arrow" x1="220" y1="162" x2="220" y2="184" stroke-width="1.5" marker-end="url(#roadmap-arrow)"/>
  <line class="arrow" x1="620" y1="162" x2="620" y2="184" stroke-width="1.5" marker-end="url(#roadmap-arrow)"/>
  <line class="arrow" x1="1020" y1="162" x2="1020" y2="184" stroke-width="1.5" marker-end="url(#roadmap-arrow)"/>

  <g data-card="understand">
    <rect class="card" x="36" y="190" width="368" height="86" rx="10" stroke-width="1.5"/>
    <text class="hdr" x="60" y="212">UNDERSTAND</text>
    <text class="role" x="60" y="239">Understand Mawja</text>
    <text class="sub" x="60" y="261">Roles · task records · independent review</text>
  </g>
  <g data-card="try">
    <rect class="card" x="436" y="190" width="368" height="86" rx="10" stroke-width="1.5"/>
    <text class="hdr" x="460" y="212">TRY</text>
    <text class="role" x="460" y="239">Try a runnable example</text>
    <text class="sub" x="460" y="261">TypeScript · JavaScript · Python</text>
  </g>
  <g data-card="adopt">
    <rect class="card" x="836" y="190" width="368" height="86" rx="10" stroke-width="1.5"/>
    <text class="hdr" x="860" y="212">ADOPT</text>
    <text class="role" x="860" y="239">Use Mawja in your project</text>
    <text class="sub" x="860" y="261">Project rules · configuration · validation</text>
  </g>

  <line class="arrow" x1="220" y1="276" x2="220" y2="300" stroke-width="1.5" marker-end="url(#roadmap-arrow)"/>
  <line class="arrow" x1="620" y1="276" x2="620" y2="300" stroke-width="1.5" marker-end="url(#roadmap-arrow)"/>
  <line class="arrow" x1="1020" y1="276" x2="1020" y2="300" stroke-width="1.5" marker-end="url(#roadmap-arrow)"/>

  <g data-card="read">
    <rect class="card" x="36" y="306" width="368" height="88" rx="10" stroke-width="1.5"/>
    <text class="ttl" x="60" y="334">Read the workflow</text>
    <text class="sub" x="60" y="356">Roles, task prompts and verification.</text>
    <text class="sub" x="60" y="376">Then follow the worked example.</text>
  </g>
  <g data-card="tutorial">
    <rect class="card" x="436" y="306" width="368" height="88" rx="10" stroke-width="1.5"/>
    <text class="ttl" x="460" y="334">Choose a language and tutorial</text>
    <text class="sub" x="460" y="356">Create the calculator project.</text>
    <text class="sub" x="460" y="376">Implement a task and return its report.</text>
  </g>
  <g data-card="setup">
    <rect class="card" x="836" y="306" width="368" height="88" rx="10" stroke-width="1.5"/>
    <text class="ttl" x="860" y="334">Assess, configure and validate</text>
    <text class="sub" x="860" y="356">Set up the tools for your repository.</text>
    <text class="sub" x="860" y="376">Validate them in a disposable example.</text>
  </g>

  <line class="rule" x1="36" y1="424" x2="1204" y2="424" stroke-width="1"/>
  <text class="foot" x="36" y="448">Follow the links below for each path.</text>
  <text class="foot" x="1204" y="448" text-anchor="end">The same roles and review requirements apply.</text>

  <defs>
    <marker id="roadmap-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ahead" d="M 0 0 L 8 4 L 0 8 z" fill="#8c959f"/>
    </marker>
  </defs>
</svg>
