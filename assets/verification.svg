<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .bg{fill:#ffffff} .card{fill:#ffffff;stroke:#d0d7de}
    .key{fill:#ecfdf5;stroke:#0e715f} .bad{fill:#fff5f5;stroke:#cf222e} .good{fill:#f0fff4;stroke:#1a7f37}
    .n{fill:#8c959f;font-size:12px;font-weight:700}
    .t{fill:#1f2328;font-size:14.5px;font-weight:650}
    .s{fill:#656d76;font-size:12.5px}
    .h{fill:#656d76;font-size:11px;font-weight:700;letter-spacing:.14em}
    .f{fill:#6e7781;font-size:12.5px}
    .arrow{stroke:#8c959f} .rule{stroke:#d0d7de}
    .kt{fill:#0e715f} .bt{fill:#cf222e} .gt{fill:#1a7f37}
    .redline{stroke:#cf222e} .greenline{stroke:#1a7f37}
    .ahead{fill:#8c959f} .aheadg{fill:#1a7f37} .aheadr{fill:#cf222e}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117} .card{fill:#161b22;stroke:#30363d}
      .key{fill:#0c2b24;stroke:#2ea88a} .bad{fill:#2a1416;stroke:#f85149} .good{fill:#0d2818;stroke:#3fb950}
      .n{fill:#6e7681} .t{fill:#e6edf3} .s{fill:#8b949e} .h{fill:#8b949e} .f{fill:#8b949e}
      .arrow{stroke:#6e7681} .rule{stroke:#30363d}
      .kt{fill:#2ea88a} .bt{fill:#f85149} .gt{fill:#3fb950}
      .redline{stroke:#f85149} .greenline{stroke:#3fb950}
      .ahead{fill:#6e7681} .aheadg{fill:#3fb950} .aheadr{fill:#f85149}
    }
  </style>
  <rect class="bg" width="1240" height="470"/>

  <text class="h" x="36" y="38">INDEPENDENT REVIEW BEFORE MERGE</text>
  <line class="rule" x1="36" y1="52" x2="1204" y2="52" stroke-width="1"/>

  <!-- ① -->
  <rect class="card" x="36" y="76" width="250" height="78" rx="10" stroke-width="1.5"/>
  <text class="n" x="56" y="100">①</text>
  <text class="t" x="80" y="100">Run affected guards</text>
  <text class="s" x="56" y="124">Task-specific checks in</text>
  <text class="s" x="56" y="142">the review environment.</text>

  <line class="arrow" x1="161" y1="154" x2="161" y2="176" stroke-width="1.5" marker-end="url(#c)"/>

  <!-- independent mutation -->
  <rect class="key" x="36" y="182" width="250" height="118" rx="10" stroke-width="2"/>
  <text class="n" x="56" y="206">②</text>
  <text class="t kt" x="80" y="206">Test a relevant fault</text>
  <text class="s" x="56" y="230">Choose a different mutation</text>
  <text class="s" x="56" y="248">from the Executor's cases.</text>
  <text class="s" x="56" y="272">Confirm the intended failure.</text>
  <text class="s" x="56" y="290">Restore and rerun.</text>

  <!-- the fork -->
  <path class="greenline" d="M 286 218 L 330 218" fill="none" stroke-width="2" marker-end="url(#cg)"/>
  <text class="gt" x="340" y="214" font-size="12.5" font-weight="600">check failed</text>
  <text class="f" x="340" y="232" style="font-size:12px">fault detected</text>

  <path class="redline" d="M 286 268 L 330 268" fill="none" stroke-width="2" marker-end="url(#cr)"/>
  <text class="bt" x="340" y="264" font-size="12.5" font-weight="600">check passed</text>
  <text class="f" x="340" y="282" style="font-size:12px">fault not detected</text>

  <!-- the red path -->
  <rect class="bad" x="36" y="330" width="470" height="72" rx="10" stroke-width="2"/>
  <text class="t bt" x="56" y="358">Revise the guard before acceptance.</text>
  <text class="s" x="56" y="382">A guard must detect a relevant fault in the behavior it protects.</text>
  <path class="redline" d="M 452 268 L 470 268 L 470 324" fill="none" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cr)"/>

  <!-- ③④⑤ -->
  <rect class="card" x="512" y="76" width="330" height="72" rx="10" stroke-width="1.5"/>
  <text class="n" x="532" y="100">③</text>
  <text class="t" x="556" y="100">Type errors did not grow</text>
  <text class="s" x="532" y="124">Configured crash diagnostics: zero.</text>
  <text class="s" x="532" y="140">They cannot enter the error budget.</text>

  <line class="arrow" x1="677" y1="148" x2="677" y2="170" stroke-width="1.5" marker-end="url(#c)"/>

  <rect class="card" x="512" y="176" width="330" height="72" rx="10" stroke-width="1.5"/>
  <text class="n" x="532" y="200">④</text>
  <text class="t" x="556" y="200">Verify the requested behavior</text>
  <text class="s" x="532" y="224">Use a reviewer-chosen command</text>
  <text class="s" x="532" y="240">and assess its output against the requirement.</text>

  <line class="arrow" x1="677" y1="248" x2="677" y2="270" stroke-width="1.5" marker-end="url(#c)"/>

  <rect class="card" x="512" y="276" width="330" height="62" rx="10" stroke-width="1.5"/>
  <text class="n" x="532" y="300">⑤</text>
  <text class="t" x="556" y="300">Check the working tree</text>
  <text class="s" x="532" y="324">Restore each fault; run git status.</text>

  <line class="arrow" x1="842" y1="307" x2="890" y2="307" stroke-width="1.5" marker-end="url(#c)"/>

  <!-- merge -->
  <rect class="good" x="900" y="266" width="304" height="82" rx="10" stroke-width="2"/>
  <text class="t gt" x="924" y="298">Merge</text>
  <text class="s" x="924" y="322">Wave log · recorded decision</text>
  <text class="s" x="924" y="338">· debt rows closed</text>

  <path class="greenline" d="M 400 218 L 470 218 L 470 112 L 506 112" fill="none" stroke-width="2" marker-end="url(#cg)"/>

  <line class="rule" x1="36" y1="424" x2="1204" y2="424" stroke-width="1"/>
  <text class="f" x="36" y="448">Select faults for new, changed or affected guards.</text>
  <text class="f" x="1204" y="448" text-anchor="end">Complete all five review steps.</text>

  <defs>
    <marker id="c"  viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahead" d="M 0 0 L 8 4 L 0 8 z" fill="#8c959f"/></marker>
    <marker id="cg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aheadg" d="M 0 0 L 8 4 L 0 8 z" fill="#1a7f37"/></marker>
    <marker id="cr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="aheadr" d="M 0 0 L 8 4 L 0 8 z" fill="#cf222e"/></marker>
  </defs>
</svg>
